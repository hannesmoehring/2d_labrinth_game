[workspace]
name = "sliding-puzzle"
version = "1.0.0"
description = "Browser-based sliding logic puzzle game with leaderboard"
channels = ["conda-forge"]
# linux-* are what the Docker image resolves against (amd64 and arm64 hosts).
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
# Node comes from conda-forge; the npm packages themselves stay in package.json.
nodejs = "22.*"

# better-sqlite3 9.x ships no prebuilt addon for Node 22, so the Docker build
# compiles it. Kept out of `default` so the runtime image carries no compilers.
[feature.build]
platforms = ["linux-64", "linux-aarch64"]

[feature.build.dependencies]
binutils = "*"  # unprefixed `ar`, which node-gyp's Makefile calls
cxx-compiler = "*"
make = "*"
python = "*"

# Level generation runs offline (it is CPU-heavy) and writes levels/levels.json,
# which the Node side imports. Kept out of `default` so the image has no Python.
[feature.levelgen.dependencies]
python = "3.12.*"
numpy = ">=2"
pytest = "*"

[feature.levelgen.tasks.generate-levels]
description = "Generate levels/levels.json, e.g. `pixi run generate-levels --count 300`"
cmd = "python -m levelgen generate"

[feature.levelgen.tasks.check-levels]
description = "Re-solve every level in levels/levels.json and verify its stored solution"
cmd = "python -m levelgen check"

[feature.levelgen.tasks.test-levelgen]
description = "Run the level generator's test suite"
cmd = "pytest -q levelgen/tests"

[environments]
default = { solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
levelgen = { features = ["levelgen"], no-default-feature = true }

# `start` and `import-levels` deliberately don't depend on `install`: the
# Docker image runs them too, and there node_modules is baked in at build time.
# `npm ci` would wipe it and the runtime image has no compilers to rebuild it.
[tasks.install]
description = "Install npm dependencies from package-lock.json"
cmd = "npm ci"
inputs = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.start]
description = "Run the game server on http://localhost:3000"
cmd = "node server.js"

[tasks.import-levels]
description = "Load levels/levels.json into the database; `--replace` drops old levels and their runs"
cmd = "node import-levels.js"

# ── Deployment (Docker Compose) ───────────────
[tasks.deploy]
description = "Build the image and (re)start the container"
cmd = "docker compose up -d --build"

[tasks.logs]
description = "Follow the container's logs"
cmd = "docker compose logs -f"

[tasks.stop]
description = "Stop and remove the container (the database volume is kept)"
cmd = "docker compose down"
