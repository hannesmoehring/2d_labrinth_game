<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui-bar">
    <span id="level-label">Level 1</span>
    <span id="timer">0.0s</span>
    <span id="move-counter">Moves: 0</span>
    <button id="restart-btn" title="Reset level (Space)">Reset</button>
  </div>

  <div id="difficulty-filter">
    <button class="diff-btn active" data-diff="All">All</button>
    <button class="diff-btn diff-easy"   data-diff="Easy">Easy</button>
    <button class="diff-btn diff-medium" data-diff="Medium">Medium</button>
    <button class="diff-btn diff-hard"   data-diff="Hard">Hard</button>
    <button class="diff-btn diff-expert" data-diff="Expert">Expert</button>
  </div>

  <div id="level-details">
    <span id="detail-dims"></span>
    <span id="detail-optimal"></span>
    <span id="detail-difficulty"></span>
  </div>

  <div id="board-wrapper">
    <div id="board"></div>
  </div>

  <!-- Overlay: name entry → leaderboard (content built by JS) -->
  <div id="overlay" class="hidden">
    <div id="overlay-box"></div>
  </div>

  <div id="controls-hint">WASD / Arrow keys to move &nbsp;·&nbsp; Space to reset</div>

  <script src="main.js"></script>
</body>
</html>
